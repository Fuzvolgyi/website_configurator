server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: website-configurator
  datasource:
    url: jdbc:postgresql://localhost:5432/website_configurator
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  bucket-name: ${STORAGE_BUCKET_NAME:website-configurator}
  public-url: ${STORAGE_PUBLIC_URL:http://localhost:9000/website-configurator}
  region: ${STORAGE_REGION:us-east-1}

translation:
  deepl:
    api-key: ${DEEPL_API_KEY:}
    api-url: ${DEEPL_API_URL:https://api-free.deepl.com/v2/translate}
  target-languages: ${TRANSLATION_TARGET_LANGS:EN,ES,HU}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.zenitnet.websiteconfigurator: DEBUG
